version: '3.8'

services:
  # PostgreSQL: Relational user data, curriculum mapping, BKT mastery
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ashi_app
      POSTGRES_PASSWORD: change_me_in_production
      POSTGRES_DB: adaptive_learning
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ashi_app -d adaptive_learning']
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB: High-throughput gamification events, XP ledgers
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ: Async event-driven gamification messaging
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB: Vector database for LLM long-term memory (RAG pipeline)
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: 'false'

volumes:
  postgres_data:
  mongo_data:
  chroma_data:
