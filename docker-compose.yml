services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vipasa
      POSTGRES_PASSWORD: vipasa
      POSTGRES_DB: vipasa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: vipasa
      RABBITMQ_DEFAULT_PASS: vipasa

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8000:8000"
    environment:
      IS_PERSISTENT: "true"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  mongo_data:
  chroma_data:
