version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: adaptive-postgres
    environment:
      POSTGRES_DB: adaptive_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: adaptive-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: adaptive-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'

  chroma:
    image: chromadb/chroma:0.5.11
    container_name: adaptive-chroma
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  mongo_data:
  chroma_data:
